name: Package GCC for macOS 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  INSTALL_PREFIX: ${{ github.workspace }}/gcc-16.2

jobs:
  build:
    runs-on: macos-14
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC via Homebrew Formula Strategy
        run: |
          brew update
          brew install gcc
          
          # Locate Homebrew's installed GCC prefix (Cellar path)
          GCC_CELLAR_PATH="$(brew --cellar gcc)/$(brew info --json gcc | jq -r '.[0].installed[0].version')"
          echo "Found GCC at: $GCC_CELLAR_PATH"
          
          # Stage into our clean distribution prefix
          mkdir -p "$INSTALL_PREFIX"
          cp -R "$GCC_CELLAR_PATH/"* "$INSTALL_PREFIX/"

      - name: Verify GCC Installation
        run: |
          "$INSTALL_PREFIX/bin/gcc" --version
          "$INSTALL_PREFIX/bin/g++" --version
          
          # Check for C++23/C++26 <generator> header
          find "$INSTALL_PREFIX" -name "generator"

      - name: Archive GCC Build
        run: |
          tar -czf gcc-macos14-bin.tar.gz -C "$(dirname "$INSTALL_PREFIX")" gcc-16.2

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-macos14-binary
          path: gcc-macos14-bin.tar.gz

      - name: Release GCC Binary
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: gcc-macos14-bin.tar.gz
          tag_name: gcc-brew-${{ github.run_id }}
          name: GCC macOS 14 Homebrew Build
          body: Portable GCC build for macOS 14 packaged directly from Homebrew's optimized formula specification.
          draft: false
          prerelease: true
