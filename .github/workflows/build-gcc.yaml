name: Install and Package GCC 16 via Homebrew Bottle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  INSTALL_PREFIX: ${{ github.workspace }}/gcc-16.2

jobs:
  build:
    runs-on: macos-14
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GCC via Homebrew Bottle
        run: |
          brew update
          # Fetch and install the precompiled binary bottle directly
          brew install gcc
          
          # Locate Homebrew's Cellar path dynamically
          GCC_CELLAR_PATH="$(brew --cellar gcc)/$(brew info --json gcc | jq -r '.[0].installed[0].version')"
          echo "Found GCC at: $GCC_CELLAR_PATH"
          
          # Stage into our distribution prefix directory
          mkdir -p "$INSTALL_PREFIX"
          cp -R "$GCC_CELLAR_PATH/"* "$INSTALL_PREFIX/"
          
          # Create standard unversioned symlinks for gcc/g++
          cd "$INSTALL_PREFIX/bin"
          for bin in gcc-*; do
            if [ -x "$bin" ] && [[ "$bin" =~ ^gcc-[0-9]+$ ]]; then
              version="${bin#gcc-}"
              ln -sf "gcc-$version" gcc
              ln -sf "g++-$version" g++
              break
            fi
          done

      - name: Verify GCC Installation and <generator> Header
        run: |
          export PATH="$INSTALL_PREFIX/bin:$PATH"
          gcc --version
          g++ --version
          
          # Locate standard library headers including <generator>
          find "$INSTALL_PREFIX" -name "generator"

      - name: Archive GCC Build
        run: |
          tar -czf gcc-16.2-macos14-bin.tar.gz -C "$(dirname "$INSTALL_PREFIX")" gcc-16.2

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-16.2-macos14-binary
          path: gcc-16.2-macos14-bin.tar.gz

      - name: Release GCC Binary
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: gcc-16.2-macos14-bin.tar.gz
          tag_name: gcc-16.2-${{ github.run_id }}
          name: GCC 16.2 macOS 14 Bottle Build
          body: Official precompiled Homebrew bottle packaging of GCC 16 for macOS 14.
          draft: false
          prerelease: true
