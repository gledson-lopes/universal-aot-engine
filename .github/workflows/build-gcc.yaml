name: Build GCC 16 via Homebrew Formula on macOS 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  INSTALL_PREFIX: ${{ github.workspace }}/gcc-16.2

jobs:
  build:
    runs-on: macos-14
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Prerequisites via Homebrew
        run: |
          brew update
          brew install gmp isl libmpc mpfr zstd make jq

      - name: Download GCC 16.2 Source & Darwin Patch
        run: |
          mkdir -p src Patches/gcc
          curl -L "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz" -o src/gcc.tar.xz
          tar -xf src/gcc.tar.xz -C src --strip-components=1
          
          # Download official Darwin/Apple Silicon patch referenced by Homebrew formula
          curl -L "https://raw.githubusercontent.com/iains/gcc-16-branch/master/gcc-16.2.0.diff" -o Patches/gcc/gcc-16.2.0.diff

      - name: Configure and Compile GCC via Homebrew Formula Specs
        run: |
          cd src
          
          # Apply Darwin maintainer patches for macOS/Apple Silicon compatibility
          patch -p1 < ../Patches/gcc/gcc-16.2.0.diff

          mkdir build && cd build
          
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export LD=""

          ../configure \
            --prefix="$INSTALL_PREFIX" \
            --libdir="$INSTALL_PREFIX/lib/gcc/current" \
            --disable-nls \
            --enable-checking=release \
            --with-gcc-major-version-only \
            --enable-languages=c,c++,objc,obj-c++,fortran \
            --program-suffix=-16 \
            --with-gmp=$(brew --prefix gmp) \
            --with-mpfr=$(brew --prefix mpfr) \
            --with-mpc=$(brew --prefix libmpc) \
            --with-isl=$(brew --prefix isl) \
            --with-zstd=$(brew --prefix zstd) \
            --with-pkgversion="Homebrew GCC 16.2.0" \
            --with-system-zlib \
            --build=aarch64-apple-darwin$(uname -r | cut -d. -f1) \
            --with-sysroot=$(xcrun --show-sdk-path)

          gmake -j$(sysctl -n hw.ncpu) BOOT_LDFLAGS=-Wl,-headerpad_max_install_names LDFLAGS_FOR_TARGET=-Wl,-headerpad_max_install_names
          gmake install

          # Setup versioned include directory structure
          cd "$INSTALL_PREFIX"
          mkdir -p lib/gcc/16
          ln -s ../current/* lib/gcc/16/ 2>/dev/null || true

          # Create unversioned symlinks for convenience
          cd bin
          if [ -f gcc-16 ]; then
            ln -sf gcc-16 gcc
            ln -sf g++-16 g++
          fi

      - name: Verify GCC Installation and <generator> Header
        run: |
          export PATH="$INSTALL_PREFIX/bin:$PATH"
          gcc --version
          g++ --version
          
          # Check for C++23/C++26 <generator> header in libstdc++
          find "$INSTALL_PREFIX" -name "generator"

      - name: Archive GCC Build
        run: |
          tar -czf gcc-16.2-macos14-bin.tar.gz -C "$(dirname "$INSTALL_PREFIX")" gcc-16.2

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-16.2-macos14-binary
          path: gcc-16.2-macos14-bin.tar.gz

      - name: Release GCC Binary
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: gcc-16.2-macos14-bin.tar.gz
          tag_name: gcc-16.2-${{ github.run_id }}
          name: GCC 16.2 macOS 14 Formula Build
          body: Fully compiled GCC 16.2 toolchain for macOS 14 using Homebrew's precise formula arguments and Darwin patches.
          draft: false
          prerelease: true
