name: Build LLVM 23.1.2 on macOS 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install ninja cmake git

      - name: Set up Environment Variables
        run: |
          echo "INSTALL_PREFIX=$HOME/llvm-23.1.2" >> $GITHUB_ENV
          echo "SRC_DIR=$HOME/llvm-project-src" >> $GITHUB_ENV

      - name: Clone LLVM 23.1.2 Tag
        run: |
          git clone --depth 1 --branch llvmorg-23.1.2 https://github.com/llvm/llvm-project.git "$HOME/llvm-project-src"

      - name: Configure CMake (LLVM Subdirectory)
        run: |
          cmake -B "$HOME/llvm-project-src/build" -S "$HOME/llvm-project-src/llvm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            -DCMAKE_INSTALL_PREFIX="$HOME/llvm-23.1.2" \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLIBCXX_ENABLE_EXPERIMENTAL_UNSTABLE_ITHIS_CAN_BREAK_YOUR_BUILD=ON \
            -DLIBCXX_INSTALL_HEADERS=ON

      - name: Build and Install LLVM and Runtimes
        run: |
          ninja -C "$HOME/llvm-project-src/build" install
          ninja -C "$HOME/llvm-project-src/build" runtimes
          ninja -C "$HOME/llvm-project-src/build" install-runtimes

      - name: Archive LLVM Build
        run: |
          tar -czf llvm-23.1.2-macos14-bin.tar.gz -C "$HOME" llvm-23.1.2

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-23.1.2-macos14-binary
          path: llvm-23.1.2-macos14-bin.tar.gz

      - name: Release LLVM Binary
        uses: softprops/action-gh-release@v2
        with:
          files: llvm-23.1.2-macos14-bin.tar.gz
          tag_name: llvm-23.1.2-macos14-${{ github.run_id }}
          name: LLVM 23.1.2 macOS 14 Build
          body: Fully self-contained upstream LLVM 23.1.2 build with C++26 libc++ and libunwind support.
          draft: false
          prerelease: false
