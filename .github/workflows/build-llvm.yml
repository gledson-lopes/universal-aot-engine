name: Build LLVM 24 on macOS 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  INSTALL_PREFIX: ${{ github.workspace }}/llvm-24
  SRC_DIR: ${{ github.workspace }}/llvm-project-src

jobs:
  build:
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_*.app 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          df -h

      - name: Install Build Tools
        run: brew install ninja

      - name: Clone LLVM 24 Branch
        run: |
          git clone --depth 1 --branch llvmorg-24-init \
            https://github.com/llvm/llvm-project.git "$SRC_DIR"

      - name: Configure CMake (Runtimes Mode)
        run: cmake -B "$SRC_DIR/build" -S "$SRC_DIR/llvm" -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_PROJECTS="clang;lld" -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" -DLLVM_TARGETS_TO_BUILD=host -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_ENABLE_ZSTD=OFF -DLIBCXX_ENABLE_EXPERIMENTAL_LIBRARY=ON -DLIBCXX_INSTALL_EXPERIMENTAL_LIBRARY=ON -DLIBCXX_ENABLE_INCOMPLETE_FEATURES=ON -DLIBCXX_INSTALL_HEADERS=ON

      - name: Build and Install LLVM
        run: |
          ninja -C "$SRC_DIR/build" runtimes
          ninja -C "$SRC_DIR/build" install install-runtimes

      - name: Verify Headers (incl. <generator>)
        run: |
          test -f "$INSTALL_PREFIX/include/c++/v1/generator" \
            && echo "OK: <generator> present"
          test -f "$INSTALL_PREFIX/include/c++/v1/experimental/simd" \
            && echo "OK: experimental headers present"
          ls "$INSTALL_PREFIX/include/c++/v1" | wc -l

      - name: Archive LLVM Build
        run: |
          tar -czf llvm-24-macos14-bin.tar.gz -C "$(dirname "$INSTALL_PREFIX")" llvm-24

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-24-macos14-binary
          path: llvm-24-macos14-bin.tar.gz

      - name: Release LLVM Binary
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: llvm-24-macos14-bin.tar.gz
          tag_name: llvm-24-${{ github.run_id }}
          name: LLVM 24 macOS 14 Runtimes Build
          body: Upstream LLVM 24 build with libc++/libc++abi/libunwind via LLVM_ENABLE_RUNTIMES, experimental and incomplete features enabled. Full header set including <generator>.
          draft: false
          prerelease: true
