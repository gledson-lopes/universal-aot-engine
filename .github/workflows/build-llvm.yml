name: Build LLVM 24 on macOS 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install ninja cmake git

      - name: Set up Environment Variables
        run: |
          echo "INSTALL_PREFIX=$HOME/llvm-24" >> $GITHUB_ENV
          echo "SRC_DIR=$HOME/llvm-project-src" >> $GITHUB_ENV

      - name: Clone LLVM 24 Branch
        run: |
          git clone --depth 1 --branch llvmorg-24-init https://github.com/llvm/llvm-project.git "$HOME/llvm-project-src"

      - name: Configure CMake (Runtimes Mode)
        run: |
          cmake -B "$HOME/llvm-project-src/build" -S "$HOME/llvm-project-src/llvm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            -DCMAKE_INSTALL_PREFIX="$HOME/llvm-24" \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DRUNTIMES_CMAKE_ARGS="\
              -DLIBCXX_ENABLE_EXPERIMENTAL_LIBRARY=ON \
              -DLIBCXX_INSTALL_EXPERIMENTAL_LIBRARY=ON \
              -DLIBCXX_ENABLE_INCOMPLETE_FEATURES=ON \
              -DLIBCXX_INSTALL_HEADERS=ON"

      - name: Build and Install LLVM and Runtimes
        run: |
          ninja -C "$HOME/llvm-project-src/build" install
          ninja -C "$HOME/llvm-project-src/build" runtimes
          ninja -C "$HOME/llvm-project-src/build" install-runtimes

      - name: Archive LLVM Build
        run: |
          tar -czf llvm-24-macos14-bin.tar.gz -C "$HOME" llvm-24

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-24-macos14-binary
          path: llvm-24-macos14-bin.tar.gz

      - name: Release LLVM Binary
        uses: softprops/action-gh-release@v2
        with:
          files: llvm-24-macos14-bin.tar.gz
          tag_name: llvm-24-${{ github.run_id }}
          name: LLVM 24 macOS 14 Build
          body: Upstream LLVM 24 build with stable C++26 libc++ and generator support.
          draft: false
          prerelease: false
