name: Build LLVM 22 on macOS 14

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ninja cmake git

      - name: Set up Environment Variables
        run: |
          echo "INSTALL_PREFIX=$HOME/llvm-22" >> $GITHUB_ENV
          echo "SRC_DIR=$HOME/llvm-project-src" >> $GITHUB_ENV

      - name: Clone LLVM Monorepo
        run: |
          git clone --depth 1 https://github.com/llvm/llvm-project.git "$HOME/llvm-project-src"

      - name: Configure CMake
        run: |
          cmake -B "$HOME/llvm-project-src/build" -S "$HOME/llvm-project-src/llvm" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            -DCMAKE_INSTALL_PREFIX="$HOME/llvm-22" \
            -DLIBCXX_ENABLE_EXPERIMENTAL_UNSTABLE_ITHIS_CAN_BREAK_YOUR_BUILD=ON \
            -DLIBCXX_INSTALL_HEADERS=ON

      - name: Build and Install LLVM
        run: |
          ninja -C "$HOME/llvm-project-src/build" install

      - name: Archive LLVM Build
        run: |
          tar -czf llvm-22-macos14-bin.tar.gz -C "$HOME" llvm-22

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-22-macos14-binary
          path: llvm-22-macos14-bin.tar.gz
